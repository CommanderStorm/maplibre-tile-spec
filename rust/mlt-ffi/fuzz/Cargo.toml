[package]
name = "mlt-ffi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[[bin]]
name = "ffi_encode_compare"
path = "fuzz_targets/ffi_encode_compare.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
mlt-core = { path = "../../mlt-core", features = ["arbitrary", "__private"] }
mlt-ffi = { path = ".." }

[lints.rust]
unsafe_code = "allow"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Restrictions
panic_in_result_fn = "warn"
todo = "warn"
unimplemented = "warn"
unused_trait_names = "warn"
use_self = "warn"

# Too noisy
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
too_many_lines = "allow"
